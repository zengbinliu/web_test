<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>智能 SQL 助手</title>
    <style>
        :root {
            color-scheme: light;
            --background: #f6f7f8;
            --surface: #ffffff;
            --text: #202326;
            --muted: #616970;
            --border: #d9dde1;
            --primary: #176b4d;
            --primary-hover: #10543c;
            --danger: #b42318;
            --warning: #8a4b08;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--background);
            color: var(--text);
            font-family: Arial, "Microsoft YaHei", sans-serif;
            letter-spacing: 0;
        }
        header {
            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }
        header > div, main { width: min(100% - 32px, 1040px); margin: 0 auto; }
        header > div { min-height: 64px; display: flex; align-items: center; }
        h1 { margin: 0; font-size: 22px; }
        main { padding: 30px 0 56px; }
        section { padding: 24px 0; border-bottom: 1px solid var(--border); }
        section:first-child { padding-top: 0; }
        h2 { margin: 0 0 14px; font-size: 17px; }
        label { display: block; margin-bottom: 8px; font-weight: 700; }
        textarea {
            width: 100%;
            min-height: 108px;
            resize: vertical;
            border: 1px solid #aeb5bc;
            border-radius: 6px;
            background: var(--surface);
            color: var(--text);
            padding: 12px;
            font: inherit;
            line-height: 1.55;
        }
        #sqlOutput, #sqlPreviewOutput { min-height: 180px; font-family: Consolas, monospace; }
        #sqlPreviewOutput { min-height: 320px; margin-top: 8px; }
        .sql-detail { margin-top: 20px; }
        textarea:focus { outline: 3px solid rgba(23, 107, 77, .18); border-color: var(--primary); }
        .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
        button {
            min-height: 40px;
            border: 1px solid var(--primary);
            border-radius: 6px;
            padding: 8px 16px;
            background: var(--primary);
            color: #ffffff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
        button:hover { background: var(--primary-hover); }
        button.secondary { background: var(--surface); color: var(--primary); }
        button.confirm { background: var(--warning); border-color: var(--warning); }
        button:disabled { cursor: wait; opacity: .65; }
        [hidden] { display: none !important; }
        .message { margin: 0 0 16px; color: var(--muted); }
        .message.error { color: var(--danger); }
        .summary { margin: 8px 0 12px; }
        .batch-item { padding: 16px 0; border-top: 1px solid var(--border); }
        .batch-item:first-child { border-top: 0; }
        .batch-title { margin: 0 0 8px; font-size: 15px; }
        .sql-preview {
            overflow-x: auto;
            margin: 10px 0 0;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #f1f3f4;
            white-space: pre-wrap;
        }
        .table-wrap { overflow-x: auto; margin-top: 12px; }
        table { border-collapse: collapse; width: 100%; background: var(--surface); }
        th, td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; vertical-align: top; }
        th { background: #eef2f0; white-space: nowrap; }
        td { max-width: 420px; overflow-wrap: anywhere; }
        @media (max-width: 560px) {
            header > div, main { width: min(100% - 20px, 1040px); }
            main { padding-top: 20px; }
            section { padding: 20px 0; }
            button { flex: 1 1 100%; }
        }
    </style>
</head>
<body>
    <header><div><h1>智能 SQL 助手</h1></div></header>
    <main>
        <section>
            <label for="queryInput">数据需求</label>
            <textarea id="queryInput" placeholder="例如：查询最近30天状态为有效的记录，只返回20条"></textarea>
            <div class="actions">
                <button id="generateBtn" type="button">生成方案</button>
            </div>
        </section>

        <section id="sqlSection" hidden>
            <label id="artifactLabel" for="sqlOutput">生成结果</label>
            <textarea id="sqlOutput" spellcheck="false"></textarea>
            <div id="sqlPreviewSection" class="sql-detail" hidden>
                <label for="sqlPreviewOutput">具体 SQL</label>
                <textarea id="sqlPreviewOutput" spellcheck="false" readonly></textarea>
            </div>
            <div class="actions">
                <button id="executeBtn" type="button">预览</button>
                <button id="confirmBtn" class="confirm" type="button" hidden>确认写入数据库</button>
            </div>
        </section>

        <section id="resultSection" aria-live="polite" hidden>
            <h2>执行结果</h2>
            <p id="resultMessage" class="message"></p>
            <div id="resultContent"></div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
